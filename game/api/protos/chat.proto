syntax = "proto3";
package main;

//option go_package = "./";
option go_package = "./pt";

message SendChatReq {
  int64  UUid =1;
  string Msg = 2;
}

message SendChatRsp {
  int64  UUid =1;
}


message ChatNtf {
  int64  UUid =1;
  string  Msg =2;
  string  Name =3;
  int64   Time =4;
}

message ChatHistoryReq {
}

message ChatHistoryRes {
  repeated ChatNtf Messages = 1;
}
