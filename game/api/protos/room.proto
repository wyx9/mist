syntax = "proto3";
package main;

option go_package = "./pt";

// 内部消息：大厅 Room actor 与玩家 Player actor 之间的跨 actor 通信。
// 由 controller 层经 rpc.Register / rpc.RegisterCall 注册 handler，
// actor 文件不再硬编码 type-switch。

message RoomPlayerJoin {
  int64  UID  = 1;
  string Name = 2;
}

message RoomPlayerLeave {
  int64 UID = 1;
}

message RoomGetPlayersReq {
}

message RoomPlayerInfo {
  int64  UID  = 1;
  string Name = 2;
}

message RoomGetPlayersRes {
  repeated RoomPlayerInfo Players = 1;
}

enum LobbyBroadcastKind {
  LOBBY_JOIN  = 0;
  LOBBY_LEAVE = 1;
  LOBBY_CHAT  = 2;
}

message LobbyBroadcast {
  LobbyBroadcastKind Kind   = 1;
  int64              UID    = 2;
  string             Name   = 3;
  string             Msg    = 4;
  int64              Time   = 5;
  int32              Online = 6;
}

message LobbyChatMessage {
  int64  UID  = 1;
  string Name = 2;
  string Msg  = 3;
  int64  Time = 4;
}
